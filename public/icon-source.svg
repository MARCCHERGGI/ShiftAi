<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Whiskey amber gradient — premium hospitality feel -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#D97706"/>
      <stop offset="55%"  stop-color="#B45309"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <!-- Top specular sweep (rim light) -->
    <radialGradient id="hi" cx="0.25" cy="0.12" r="0.85">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Thin glass rim -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Soft drop on the mark -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle base (Apple corner ratio) -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#hi)"/>

  <!-- Inner glass rim -->
  <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none" stroke="url(#rim)" stroke-width="3" stroke-opacity="0.7"/>

  <!-- "S" mark — geometric, brand-bold -->
  <g filter="url(#softShadow)" transform="translate(512 528)">
    <path d="
      M 200 -250
      C 200 -320, 130 -350, 40 -350
      C -70 -350, -180 -300, -180 -200
      C -180 -110, -100 -75, 10 -55
      C 120 -35, 180 0, 180 80
      C 180 170, 100 220, -10 220
      C -120 220, -190 170, -210 90
    "
    fill="none" stroke="#FAF7F1" stroke-width="108" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top sweep highlight -->
  <path d="M 0,0 L 1024,0 L 1024,300 Q 512,380 0,300 Z" fill="#FFFFFF" fill-opacity="0.10"/>
</svg>
